<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intake Timetable Converter</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    .hidden { display:none !important; }
  /* ---- APSpace dark theme (approximation: near-black surfaces, Ionic-style blue accent) ---- */
  :root { --bg:#121212; --surface:#1c1c1e; --surface2:#2a2a2d; --border:#38383a; --accent:#3880ff; --accent-h:#4c8dff; --text:#f2f2f7; --muted:#98989f; }
  body { background:var(--bg) !important; color:var(--text) !important; }
  .bg-gray-900 { background:var(--surface) !important; }
  .bg-gray-800 { background:var(--surface) !important; }
  .bg-gray-700 { background:var(--surface2) !important; }
  .border-gray-700 { border-color:var(--border) !important; }
  .text-gray-400 { color:var(--muted) !important; }
  .text-gray-300 { color:#c7c7cc !important; }
  .text-blue-400 { color:#5b9bff !important; }
  .btn { background:var(--accent) !important; border-radius:.6rem !important; }
  .btn:hover { background:var(--accent-h) !important; transform:translateY(-1px); box-shadow:0 4px 14px rgba(56,128,255,.35); }
  .btn:active { transform:translateY(0) scale(.98); }
  .btn-sec { background:var(--surface2) !important; border:1px solid var(--border); }
  .btn-sec:hover { background:#38383c !important; box-shadow:none; }
  .field { background:var(--surface2) !important; border-color:var(--border) !important; transition:border-color .2s, box-shadow .2s; }
  .field:focus { border-color:var(--accent) !important; box-shadow:0 0 0 3px rgba(56,128,255,.25) !important; }
  .chip { background:var(--surface2) !important; transition:background .2s, transform .15s; }
  .chip:hover { background:var(--accent) !important; transform:translateY(-1px); }
  .tab { transition:background .2s, color .2s; }
  .tab.active { background:var(--accent) !important; }
  pre.json { background:#0d0d0f !important; border-color:var(--border) !important; }
  nav, section, .week-card { border-radius:1rem !important; }
  .week-card { transition:transform .25s ease, box-shadow .25s ease, border-color .25s; }
  .week-card:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.5); border-color:#4a4a4e !important; }
  .cls { border-left:3px solid var(--accent); transition:transform .2s, background .2s; }
  .cls:hover { transform:translateX(4px); background:#323236 !important; }

  /* ---- animations ---- */
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes popIn { from { opacity:0; transform:scale(.94) translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { opacity:.45; } }
  #login-card { animation:popIn .5s cubic-bezier(.2,.8,.2,1) both; }
  #app:not(.hidden) { animation:fadeIn .5s ease both; }
  nav { animation:fadeUp .5s ease both; }
  section { animation:fadeUp .5s .08s ease both; }
  .week-card { animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both; }
  .cls { animation:slideIn .4s ease both; }
  .pane-in { animation:fadeIn .3s ease both; }
  .loading { animation:pulse 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  body { font-family: 'Inter', system-ui, sans-serif; background:#111827; color:#e5e7eb; }
  .btn { background:#2563eb; color:#fff; border-radius:.375rem; padding:.5rem 1rem; font-size:.875rem; font-weight:600; transition:background .15s; }
  .btn:hover { background:#1d4ed8; }
  .btn:disabled { opacity:.5; }
  .btn-sec { background:#4b5563; }
  .btn-sec:hover { background:#374151; }
  .field { background:#374151; border:1px solid #4b5563; color:#fff; border-radius:.375rem; padding:.5rem .75rem; font-size:.875rem; }
  .field:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 1px #2563eb; }
  .tab { padding:.25rem .75rem; border-radius:.375rem; font-size:.8rem; color:#9ca3af; }
  .tab.active { background:#2563eb; color:#fff; }
  .chip { background:#374151; border-radius:9999px; padding:.15rem .7rem; font-size:.8rem; cursor:pointer; }
  .chip:hover { background:#2563eb; }
  pre.json { background:#1f2937; border:1px solid #4b5563; border-radius:.5rem; padding:1rem; font-size:.75rem; max-height:28rem; overflow:auto; white-space:pre; }
</style>
</head>
<body class="p-4 sm:p-8">

<!-- LOGIN (same credentials as the original converter) -->
<div id="login-container" class="w-full max-w-md mx-auto mt-24">
  <div id="login-card" class="bg-gray-900 p-8 shadow-xl rounded-2xl border border-gray-700">
    <h2 class="text-2xl font-bold text-white text-center mb-1">Timetable Converter</h2>
    <p class="text-gray-400 text-sm text-center mb-6">Please log in to access this feature</p>
    <p id="login-message" class="hidden p-3 text-sm rounded-lg text-center bg-red-900 text-red-200 mb-4"></p>
    <form id="login-form" class="space-y-4" onsubmit="return false">
      <div><label class="block text-sm text-gray-300 mb-1">Username</label><input id="username" required class="field w-full"></div>
      <div><label class="block text-sm text-gray-300 mb-1">Password</label><input id="password" type="password" required class="field w-full"></div>
      <button type="submit" class="btn w-full">Sign In</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="container mx-auto hidden">
  <nav class="bg-gray-900 p-4 mb-6 shadow-xl rounded-xl border border-gray-700 flex justify-between items-center">
    <span class="text-xl font-bold text-white">Intake Timetable Converter</span>
    <a href="https://thegoodknow.github.io/personal/pages/timetable.html" target="_blank" class="text-sm px-4 py-2 rounded-lg text-white bg-gray-600 hover:bg-gray-700">View Timetable Page</a>
  </nav>

  <section class="bg-gray-800 p-6 shadow-xl rounded-2xl border border-gray-700 mb-6">
    <div class="flex flex-wrap items-end gap-4">
      <div class="flex-1 min-w-[220px]">
        <label for="intake" class="block text-sm font-medium text-gray-300 mb-1">Intake code</label>
        <input id="intake" list="intake-list" placeholder="e.g. UCDF2511ICT(SE)" value="UCDF2511ICT(SE)" autocomplete="off" class="field w-full uppercase">
        <datalist id="intake-list"></datalist>
      </div>
      <div class="min-w-[140px]">
        <label for="group" class="block text-sm font-medium text-gray-300 mb-1">Group</label>
        <select id="group" class="field w-full"><option value="">All groups</option></select>
      </div>
      <button id="reload" class="btn btn-sec">Reload data</button>
      <button id="dl-all" class="btn hidden">Download all weeks</button>
    </div>
    <div id="suggest" class="flex flex-wrap gap-2 mt-3"></div>
    <p id="status" class="text-sm text-gray-400 mt-3">Loading timetable data…</p>

    <details id="manual" class="hidden mt-4">
      <summary class="text-sm text-yellow-400 cursor-pointer">Couldn't reach the link from the browser — paste the JSON instead</summary>
      <textarea id="manual-text" rows="5" placeholder="Paste the JSON from the link here" class="field w-full mt-2 text-xs"></textarea>
      <button id="manual-load" class="btn mt-2">Use pasted JSON</button>
    </details>
  </section>

  <div id="weeks" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>
</div>

<script src = "../Java/convert.js"></script>
</body>
</html>
