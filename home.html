<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Workspace Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0c0e;
            --surface-glass: rgba(20, 21, 26, 0.75);
            --card-inner: rgba(30, 32, 40, 0.5);
            --border-glass: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(59, 130, 246, 0.2);
            --text-main: #ffffff;
            --text-subtle: #94a3b8;
            
            /* Sourced from APSpace liquid glass palette color identity */
            --apspace-blue: #2563eb; 
            --apspace-cyan: #38bdf8;
            --apspace-gold: #fbbf24;
            --apspace-gold-bg: rgba(251, 191, 36, 0.15);
            --color-test: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .workspace-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        /* Fluid Glass System Headers */
        .workspace-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            padding: 18px 24px;
            border-radius: 16px;
        }

        .header-left h1 { 
            font-size: 1.25rem; 
            font-weight: 700; 
            letter-spacing: -0.01em; 
            color: var(--apspace-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .live-clock-wrapper { display: flex; align-items: center; gap: 8px; color: var(--apspace-cyan); font-weight: 600; font-size: 0.95rem; }
        
        .highlight-countdown {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
        }

        /* Broadcast Dynamic Alerts */
        .broadcast-banner {
            grid-column: 1 / -1;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--text-main);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        /* Dashboard Containment Cards */
        .dashboard-section {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--apspace-blue);
            letter-spacing: 0.02em;
            text-transform: capitalize;
            padding-bottom: 4px;
        }

        .section-header .material-icons { font-size: 1.35rem; color: var(--apspace-blue); }

        /* Modern Lecture Cards Engine */
        .timetable-scroll-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .class-card {
            background: var(--card-inner);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 18px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .class-card.current-class {
            border-color: rgba(251, 191, 36, 0.4);
            background: linear-gradient(145deg, rgba(30,32,40,0.6) 0%, rgba(251,191,36,0.03) 100%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-title { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; font-size: 0.95rem; color: #ffffff; line-height: 1.4; }
        .card-title .material-icons { font-size: 1.25rem; color: var(--apspace-cyan); margin-top: 2px; }
        .card-subtitle { font-size: 0.82rem; color: var(--text-subtle); margin-left: 30px; margin-top: 4px; }
        
        .card-details { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 16px; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.03); 
            font-size: 0.82rem; 
            color: var(--apspace-cyan);
            font-weight: 500;
        }
        
        /* Premium Badges System */
        .pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
        .open-tag { background: rgba(255,255,255,0.06); color: #fff; }
        .online-tag { background: rgba(56, 189, 248, 0.12); color: var(--apspace-cyan); border: 1px solid rgba(56, 189, 248, 0.2); }
        .replacement-tag { background: rgba(251, 191, 36, 0.12); color: var(--apspace-gold); border: 1px solid rgba(251, 191, 36, 0.2); }
        .test-tag { background: rgba(239, 68, 68, 0.12); color: var(--color-test); border: 1px solid rgba(239, 68, 68, 0.2); }
        .conducted-tag { background: rgba(148, 163, 184, 0.1); color: var(--text-subtle); }
        
        /* Sourced directly from image_47697.jpg asset visualization */
        .active-now-tag { 
            background: var(--apspace-gold-bg); 
            color: var(--apspace-gold); 
            border: 1px solid rgba(251,191,36,0.3);
            font-weight: 800;
            padding: 5px 12px;
        }

        /* Clean Repository List Groups */
        .pages-list-container { display: flex; flex-direction: column; gap: 2px; background: var(--card-inner); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-glass); }
        .page-item-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s ease;
        }
        .page-item-link:last-child { border-bottom: none; }
        .page-item-link:hover { background: rgba(255, 255, 255, 0.03); }
        
        .page-title-group { display: flex; align-items: center; gap: 14px; text-align: left; }
        .page-title-group .material-icons { color: var(--apspace-blue); font-size: 1.2rem; }
        .page-chevron { font-size: 1rem; color: var(--text-subtle); opacity: 0.7; }

        /* Deadlines Segment Control Row */
        .tabs-navigation-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid var(--border-glass); }
        .module-tab-btn {
            background: transparent; border: none; color: var(--text-subtle); padding: 8px 14px; font-family: inherit; font-size: 0.75rem; font-weight: 600; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
        }
        .module-tab-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .module-tab-btn.active-tab { background: rgba(37, 99, 235, 0.15); color: var(--apspace-cyan); border: 1px solid rgba(37, 99, 235, 0.2); }
        
        .deadline-task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-inner);
            border: 1px solid var(--border-glass);
            padding: 14px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .task-info-side { display: flex; flex-direction: column; gap: 4px; }
        .deadline-title { font-size: 0.88rem; font-weight: 600; color: #fff; }
        .deadline-date-sub { font-size: 0.78rem; color: var(--text-subtle); }

        /* Clean Forms Elements */
        .turnitin-input-group { display: flex; gap: 8px; width: 100%; }
        .turnitin-input-group input {
            flex-grow: 1; background: var(--card-inner); border: 1px solid var(--border-glass); border-radius: 8px; padding: 12px 16px; color: #fff; font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s ease;
        }
        .turnitin-input-group input:focus { border-color: var(--apspace-blue); }
        .turnitin-btn {
            background: var(--apspace-blue); color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s ease;
        }
        .turnitin-btn:hover { background: #1d4ed8; }

        .progress-bar-track { width: 100%; height: 5px; background: rgba(255,255,255,0.04); border-radius: 10px; overflow: hidden; margin-top: 4px; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--apspace-cyan); transition: width 0.4s ease; }

        .empty-state { text-align: center; padding: 32px; color: var(--text-subtle); font-size: 0.82rem; font-style: italic; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="workspace-grid">
        
        <header class="workspace-header">
            <div class="header-left">
                <span class="material-icons">blur_on</span>
                <h1>APSpace Workspace</h1>
            </div>
            <div class="header-right">
                <div id="header-next-class" class="header-next-container">
                    <span class="highlight-countdown">Syncing context telemetry...</span>
                </div>
                <div class="live-clock-wrapper">
                    <span class="material-icons" style="font-size:1.1rem;">schedule</span>
                    <span id="live-clock">00:00:00 AM</span>
                </div>
            </div>
        </header>

        <div id="greeting-banner" class="broadcast-banner">
            🚀 Loading system configurations...
        </div>

        <main class="dashboard-section">
            <div class="section-header">
                <span class="material-icons">segment</span>
                <span>Upcoming Schedule</span>
            </div>
            
            <div id="daily-progress-container" style="display:none; padding: 0 4px;">
                <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-subtle); margin-bottom:6px;">
                    <span>Today's Lecture Track Completion</span>
                </div>
                <div class="progress-bar-track">
                    <div id="daily-progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <div id="timetable-container" class="timetable-scroll-box">
                <div class="empty-state">Assembling fluid pipeline view...</div>
            </div>
        </main>

        <aside style="display: flex; flex-direction: column; gap: 24px;">
            
            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">date_range</span>
                    <span>Deadlines Registry</span>
                </div>
                <div id="module-tabs-row" class="tabs-navigation-row"></div>
                <div id="deadlines-container" style="min-height: 120px;"></div>
            </section>

            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">widgets</span>
                    <span>Tools & Hosted Pages</span>
                </div>
                <div id="pages-container" class="pages-list-container"></div>
            </section>

            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">security</span>
                    <span>Turnitin Portal Linker</span>
                </div>
                <div class="turnitin-input-group">
                    <input type="text" id="turnitin-id-field" placeholder="Enter Assignment Report ID...">
                    <button class="turnitin-btn" onclick="redirectToTurnitin()">
                        <span class="material-icons">arrow_forward</span>
                    </button>
                </div>
            </section>

        </aside>
    </div>

    <script src="Java/Home.js"></script>
</body>
</html>
