<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Workspace Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0c;
            --surface-glass: rgba(22, 22, 26, 0.65);
            --border-glass: rgba(255, 255, 255, 0.07);
            --border-glow: rgba(255, 255, 255, 0.15);
            --text-main: #f3f4f6;
            --text-subtle: #9ca3af;
            --accent-primary: #6366f1;
            
            --color-online: #06b6d4;
            --color-replacement: #f59e0b;
            --color-test: #ef4444;
            --color-conducted: #4b5563;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #070709 0%, #0f0f15 50%, #09090b 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .workspace-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        /* Top Header System Row */
        .workspace-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .header-left h1 { font-size: 1.3rem; font-weight: 700; tracking: -0.02em; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .live-clock-wrapper { display: flex; align-items: center; gap: 8px; color: var(--accent-primary); font-weight: 600; font-size: 1rem; }
        
        .highlight-countdown {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Dynamic Broadcast Banner */
        .broadcast-banner {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, rgba(99,102,241,0.1) 0%, rgba(22,22,26,0.5) 100%);
            border: 1px solid var(--border-glass);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Standard Containers Layout */
        .dashboard-section {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 12px;
        }

        .section-header .material-icons { color: var(--accent-primary); font-size: 1.25rem; }

        /* Integrated Timetable Components */
        .timetable-scroll-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 620px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .class-card {
            background: rgba(30, 30, 40, 0.3);
            border: 1px solid var(--border-glass);
            border-left: 4px solid var(--accent-primary);
            border-radius: 8px;
            padding: 14px;
            transition: all 0.2s ease;
        }

        .class-card.current-class {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.4) rgba(99, 102, 241, 0.4) rgba(99, 102, 241, 0.4) var(--accent-primary);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.1);
        }

        .card-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; color: #fff; }
        .card-title .material-icons { font-size: 1.15rem; color: var(--accent-primary); }
        .card-title .online-icon { color: var(--color-online); }
        .card-subtitle { font-size: 0.8rem; color: var(--text-subtle); margin-left: 26px; margin-top: 2px; }
        .card-details { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.8rem; color: var(--text-subtle); }
        
        /* General Status Pills Matrix */
        .pill { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .open-tag { background: rgba(255,255,255,0.06); color: var(--text-main); }
        .online-tag { background: rgba(6, 182, 212, 0.15); color: var(--color-online); border: 1px solid rgba(6, 182, 212, 0.2); }
        .replacement-tag { background: rgba(245, 158, 11, 0.15); color: var(--color-replacement); border: 1px solid rgba(245, 158, 11, 0.2); }
        .test-tag { background: rgba(239, 68, 68, 0.15); color: var(--color-test); border: 1px solid rgba(239, 68, 68, 0.2); }
        .conducted-tag { background: rgba(75, 85, 99, 0.2); color: var(--text-subtle); }
        .active-now-tag { background: #ef4444; color: #ffffff; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Direct Files Links Group */
        .pages-list-container { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
        .page-item-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .page-item-link:hover { background: rgba(255,255,255,0.05); border-color: var(--border-glow); padding-left: 14px; }
        .page-title-group { display: flex; align-items: center; gap: 12px; text-align: left; }
        .page-title-group .material-icons { color: var(--text-subtle); font-size: 1.15rem; }

        /* Deadline Dynamic Multi-Tabs Layout */
        .tabs-navigation-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid var(--border-glass); }
        .module-tab-btn {
            background: transparent; border: none; color: var(--text-subtle); padding: 6px 12px; font-family: inherit; font-size: 0.75rem; font-weight: 600; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
        }
        .module-tab-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .module-tab-btn.active-tab { background: var(--accent-primary); color: #fff; }
        
        .deadline-task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 25, 0.4);
            border: 1px solid var(--border-glass);
            border-left: 3px solid rgba(255,255,255,0.15);
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 8px;
        }
        .task-info-side { display: flex; flex-direction: column; gap: 2px; }
        .deadline-title { font-size: 0.85rem; font-weight: 500; color: #fff; }
        .deadline-date-sub { font-size: 0.75rem; color: var(--text-subtle); }

        /* Turnitin Router Interface Box */
        .turnitin-input-group { display: flex; gap: 8px; width: 100%; }
        .turnitin-input-group input {
            flex-grow: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border-glass); border-radius: 6px; padding: 8px 12px; color: #fff; font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s ease;
        }
        .turnitin-input-group input:focus { border-color: var(--accent-primary); }
        .turnitin-btn {
            background: var(--accent-primary); color: #fff; border: none; border-radius: 6px; padding: 0 14px; font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s ease;
        }
        .turnitin-btn:hover { background: #4f46e5; }

        /* Track Progress Metrics Ticker */
        .progress-bar-track { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 4px; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-primary) 0%, #a855f7 100%); transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        .empty-state { text-align: center; padding: 24px; color: var(--text-subtle); font-size: 0.8rem; font-style: italic; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="workspace-grid">
        
        <!-- Header Information Bar -->
        <header class="workspace-header">
            <div class="header-left">
                <h1>Workspace Environment</h1>
            </div>
            <div class="header-right">
                <div id="header-next-class" class="header-next-container">
                    <span class="highlight-countdown">Loading tracker telemetry...</span>
                </div>
                <div class="live-clock-wrapper">
                    <span class="material-icons">schedule</span>
                    <span id="live-clock">00:00:00 AM</span>
                </div>
            </div>
        </header>

        <!-- Greeting Notice Area -->
        <div id="greeting-banner" class="broadcast-banner">
            🚀 Loading local automation configurations...
        </div>

        <!-- Left Column: Timetable Engine -->
        <main class="dashboard-section">
            <div class="section-header">
                <span class="material-icons">event_note</span>
                <span>Weekly Lecture Schedule</span>
            </div>
            
            <!-- Day Progress Bar Module -->
            <div id="daily-progress-container" style="display:none; padding: 0 4px 6px 4px;">
                <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-subtle); margin-bottom:4px;">
                    <span>Today's Class Completion</span>
                </div>
                <div class="progress-bar-track">
                    <div id="daily-progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <div id="timetable-container" class="timetable-scroll-box">
                <div class="empty-state">Syncing network streams...</div>
            </div>
        </main>

        <!-- Right Column: Hosted Tools & Deadlines -->
        <aside style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Section: Assignment Tracker -->
            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">assignment</span>
                    <span>Deadlines Registry</span>
                </div>
                <div id="module-tabs-row" class="tabs-navigation-row"></div>
                <div id="deadlines-container" style="min-height: 120px;"></div>
            </section>

            <!-- Section: Hosted Repository Pages -->
            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">layers</span>
                    <span>Tools & Hosted Pages</span>
                </div>
                <div id="pages-container" class="pages-list-container"></div>
            </section>

            <!-- Section: Turnitin Portal Linker -->
            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">verified_user</span>
                    <span>Turnitin Portal Linker</span>
                </div>
                <div class="turnitin-input-group">
                    <input type="text" id="turnitin-id-field" placeholder="Enter Assignment Report ID...">
                    <button class="turnitin-btn" onclick="redirectToTurnitin()">
                        <span class="material-icons">launch</span>
                    </button>
                </div>
            </section>

        </aside>
    </div>

    <script src="Java/Home.js"></script>
</body>
</html>
