<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Dashboard</title>
    <!-- Google Material Icons Layout Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <!-- Main Global Stylesheet Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* --- Dashboard Workspace Layout Framework --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 850px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .right-column-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .page-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empty-state {
            color: var(--text-subtle);
            font-style: italic;
            text-align: center;
            padding: 20px 0;
        }

        /* --- Liquid Glass UI Panel Styles --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 30px;
            padding: 12px 24px;
            background-color: rgba(30, 30, 30, 0.65) !important;
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .clock-display {
            font-weight: 700;
            color: #007BFF;
        }

        .info-play-arrow {
            color: #FFC107 !important;
            font-size: 1.2rem;
            margin-right: 8px;
            animation: flash-play 1.2s infinite;
        }

        @keyframes flash-play {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .highlight-countdown {
            color: #FFC107;
            font-weight: 700;
        }

        .greeting-container {
            max-width: 1200px;
            margin: 20px auto 0 auto;
            padding: 15px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-light);
            background: rgba(30, 30, 30, 0.45);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .dashboard-section {
            background-color: rgba(30, 30, 30, 0.45) !important;
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .dashboard-section:nth-child(2) {
            animation-delay: 0.15s;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--color-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        /* --- Link Elements & Liquid Glow Animations --- */
        .page-item-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(37, 37, 37, 0.4) !important;
            padding: 12px 16px;
            border-radius: 8px !important;
            text-decoration: none;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.03) !important;
            position: relative;
            overflow: hidden;
            transition: cubic-bezier(0.25, 0.8, 0.25, 1) 0.35s !important;
        }

        .page-item-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .page-item-link:hover::before {
            left: 100%;
        }

        .page-item-link:hover {
            background-color: rgba(255, 255, 255, 0.06) !important;
            border-color: rgba(0, 123, 255, 0.4) !important;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.15);
            transform: translateY(-2px) scale(1.01);
        }

        /* --- Student Portals Grid --- */
        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .portal-grid { grid-template-columns: 1fr; }
        }

        .portal-card {
            height: 100%;
            box-sizing: border-box;
        }

        .link-arrow {
            font-size: 1rem !important;
            color: var(--text-subtle);
        }

        /* --- Timetable Layout Gloss Cards --- */
        .class-card {
            background-color: rgba(40, 40, 40, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.02) !important;
            border-radius: 10px !important;
            backdrop-filter: blur(4px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .class-card:hover {
            transform: scale(1.015);
            background-color: rgba(50, 50, 50, 0.45) !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Passed/Conducted Schedule Processing State rules */
        .class-card.conducted {
            opacity: 0.45;
            filter: grayscale(40%);
            border-left: 5px solid #444444 !important;
            pointer-events: none;
        }

        .conducted-tag {
            background-color: #444444 !important;
            color: var(--text-subtle) !important;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Unified Navigation Bar Layout Structure -->
    <header class="header">
        <div class="logo-group">
            <img src="img/apspace-white.svg" alt="APSpace" id="logo-icon" style="height: 24px; width: auto;">
            <span id="live-clock" class="clock-display" style="font-size: 1.1rem; margin-left: 5px;">00:00:00</span>
        </div>
        
        <div class="header-summary-bar">
            <div class="summary-item next-class-display">
                <span class="material-icons info-play-arrow">play_arrow</span>
                <span id="header-next-class">Checking schedule...</span>
            </div>
        </div>
    </header>

    <!-- Contextual Dynamic Greetings Frame -->
    <div class="greeting-container" id="greeting-banner">
        Loading workspace greeting...
    </div>

    <!-- Main Workspace Dashboard Hub Content panels -->
    <main class="dashboard-grid">
        
        <!-- Left Column Pane: Interactive Calendar Schedule Grid -->
        <section class="dashboard-section">
            <div class="section-header">
                <span class="material-icons">auto_stories</span>
                <span>Upcoming Schedule</span>
            </div>
            <div id="timetable-container" class="list-container">
                <div class="empty-state">Loading timetable schedules...</div>
            </div>
        </section>

        <!-- Right Side Column Pane: System Modules Stack Group -->
        <div class="right-column-group">
            
            <!-- Tool Tracking Cards Row -->
            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">layers</span>
                    <span>Tools & Hosted Pages</span>
                </div>
                <div id="pages-container" class="list-container">
                    <div class="empty-state">Loading workspace tools...</div>
                </div>
            </section>

            <!-- Student Institutional Access Gateway Panels -->
            <section class="dashboard-section">
                <div class="section-header">
                    <span class="material-icons">school</span>
                    <span>Student Portals & LMS</span>
                </div>
                <div class="portal-grid">
                    <a href="https://apspace.apu.edu.my" target="_blank" class="page-item-link portal-card">
                        <div class="page-title-group">
                            <span class="material-icons">dashboard</span>
                            <span>APSpace Portal</span>
                        </div>
                        <span class="material-icons link-arrow">launch</span>
                    </a>
                    <a href="https://lms2.apiit.edu.my/my/" target="_blank" class="page-item-link portal-card">
                        <div class="page-title-group">
                            <span class="material-icons">local_library</span>
                            <span>APU LMS</span>
                        </div>
                        <span class="material-icons link-arrow">launch</span>
                    </a>
                </div>
            </section>
        </div>

    </main>

    <!-- Separated Java Module Script Engine Hook -->
    <script src="Java/Home.js"></script>
</body>
</html>
