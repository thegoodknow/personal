<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    
    <!-- Material Icons Link -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* Base Page Setup */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }

        /* Top Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .clock-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            color: #38bdf8;
        }

        /* Sidebar Container on the Left */
        #slidebar {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden offscreen to the left */
            width: 280px;
            height: 100%;
            background-color: #111827; 
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            transition: left 0.3s ease; 
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        /* Open State */
        #slidebar.open {
            left: 0; 
        }

        /* Close Button Header (Shows only the Close Icon) */
        .sidebar-header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            padding: 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .sidebar-link:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Main App Grid Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
            padding: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Content Sections */
        .content-section {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }

        /* Select Week Dropdown */
        .selector-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        select {
            background-color: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        /* Timetable Day Headers & Cards */
        .day-header {
            background-color: #1d4ed8;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1rem;
        }

        .class-card {
            background-color: #0f172a;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 0 6px 6px 0;
            margin-top: 10px;
        }

        .class-card.today {
            border-left-color: #10b981;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
        }

        .pill {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .online-tag { background-color: #1e40af; color: #93c5fd; }
        .open-tag { background-color: #065f46; color: #6ee7b7; }
        .replacement-tag { background-color: #854d0e; color: #fde047; }
        .test-tag { background-color: #991b1b; color: #fca5a5; }

        .card-subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 5px 0 10px 0;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        /* Facilities Directory */
        .directory-block {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .directory-block-title {
            font-size: 1rem;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }

        .directory-features {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .directory-features span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Map Modal Styles */
        #map-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #map-modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 6px;
            object-fit: contain;
            border: 2px solid #334155;
        }

        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: #fff;
        }

        /* Simple Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
        <div class="header-title-group">
            <button id="sidebar-toggle" style="background:none; border:none; color:#fff; cursor:pointer;">
                <span class="material-icons" style="font-size: 1.8rem;">menu</span>
            </button>
            <span class="header-title">Workspace</span>
        </div>
        <div class="clock-container">
            <span class="material-icons">schedule</span>
            <span id="live-clock">00:00:00</span>
        </div>
    </header>

    <!-- Sidebar HTML Structure on Left -->
    <div id="slidebar">
        <div class="sidebar-header">
            <button id="sidebar-close">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="sidebar-content">
            <a href="#" id="open-map-btn" class="sidebar-link">
                <span class="material-icons">map</span>
                <span>Campus Map</span>
            </a>
            <!-- Keep adding extra links here! -->
        </div>
    </div>

    <!-- Map Modal containing your APU MAP.jpeg -->
    <div id="map-modal">
        <div class="modal-content">
            <button id="close-map-btn" class="close-modal-btn">
                <span class="material-icons" style="font-size: 2.2rem;">cancel</span>
            </button>
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;">APU Campus Map</h3>
            <!-- This image is dynamically populated -->
            <img src="APU MAP.jpeg" alt="APU Campus Map">
        </div>
    </div>

    <!-- Main Workspace Container -->
    <main class="main-container">
        
        <!-- Left Side: Dynamic Timetables -->
        <section class="content-section">
            <div class="selector-group">
                <span id="next-class-text" style="font-weight: bold; color: #38bdf8;">Loading Schedule...</span>
                <select id="week-selector">
                    <option value="current">Active Week</option>
                    <option value="next">Next Week Preview</option>
                    <option value="exams">All Scheduled Exams</option>
                </select>
            </div>
            
            <div id="timetable-target">
                <!-- Javascript will render timetable days and cards here -->
            </div>
        </section>

        <!-- Right Side: Deadlines and Facilities Directories -->
        <aside style="display: flex; flex-direction: column; gap: 25px;">
            <!-- Urgency/Deadline Target -->
            <div class="content-section" style="padding: 15px;">
                <h4 style="margin: 0 0 10px 0; color: #94a3b8;">Urgent Deadline</h4>
                <div id="assignment-target">
                    <!-- Deadline card renders here -->
                </div>
            </div>

            <!-- Facilities/Block Directory Target -->
            <div class="content-section">
                <h4 style="margin: 0 0 15px 0; color: #38bdf8; display: flex; align-items: center; gap: 8px;">
                    <span class="material-icons">business</span>
                    <span>Campus Directory</span>
                </h4>
                <div id="facilities-target">
                    <!-- Dynamic facilities lists from facilities.json render here -->
                </div>
            </div>
        </aside>

    </main>

    <!-- Connect your external script file containing your cleaned JavaScript mechanics -->
    <script src="Java/personal.js"></script>
</body>
</html>
