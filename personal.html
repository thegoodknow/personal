<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    
    <!-- Link to your original stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Material Icons Link -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- ONLY the styles needed for the new Left Sidebar & Map Modal -->
    <style>
        /* Sidebar Container on the Left */
        #slidebar {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden offscreen to the left */
            width: 280px;
            height: 100%;
            background-color: #111827; 
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            transition: left 0.3s ease; 
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        /* Open State */
        #slidebar.open {
            left: 0; 
        }

        /* Close Button Header (Shows only the Close Icon) */
        .sidebar-header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            padding: 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .sidebar-link:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Map Modal Styles */
        #map-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #map-modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 6px;
            object-fit: contain;
            border: 2px solid #334155;
        }

        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
        <div class="header-title-group">
            <button id="sidebar-toggle" style="background:none; border:none; color:#fff; cursor:pointer;">
                <span class="material-icons" style="font-size: 1.8rem;">menu</span>
            </button>
            <span class="header-title">Workspace</span>
        </div>
        <div class="clock-container">
            <span class="material-icons">schedule</span>
            <span id="live-clock">00:00:00</span>
        </div>
    </header>

    <!-- Sidebar HTML Structure on Left -->
    <div id="slidebar">
        <div class="sidebar-header">
            <button id="sidebar-close">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="sidebar-content">
            <a href="#" id="open-map-btn" class="sidebar-link">
                <span class="material-icons">map</span>
                <span>Campus Map</span>
            </a>
        </div>
    </div>

    <!-- Map Modal containing APU MAP.jpeg inside the img/ folder -->
    <div id="map-modal">
        <div class="modal-content">
            <button id="close-map-btn" class="close-modal-btn">
                <span class="material-icons" style="font-size: 2.2rem;">cancel</span>
            </button>
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;">APU Campus Map</h3>
            <!-- Pointed to the corrected path -->
            <img src="img/APU MAP.jpeg" alt="APU Campus Map">
        </div>
    </div>

    <!-- Main Workspace Container -->
    <main class="main-container">
        
        <!-- Left Side: Dynamic Timetables -->
        <section class="content-section">
            <div class="selector-group">
                <span id="next-class-text" style="font-weight: bold; color: #38bdf8;">Loading Schedule...</span>
                <select id="week-selector">
                    <option value="current">Active Week</option>
                    <option value="next">Next Week Preview</option>
                    <option value="exams">All Scheduled Exams</option>
                </select>
            </div>
            
            <div id="timetable-target">
                <!-- Days and cards render here -->
            </div>
        </section>

        <!-- Right Side: Deadlines and Facilities Directories -->
        <aside style="display: flex; flex-direction: column; gap: 25px;">
            <!-- Urgency/Deadline Target -->
            <div class="content-section" style="padding: 15px;">
                <h4 style="margin: 0 0 10px 0; color: #94a3b8;">Urgent Deadline</h4>
                <div id="assignment-target">
                    <!-- Deadline card renders here -->
                </div>
            </div>

            <!-- Facilities/Block Directory Target -->
            <div class="content-section">
                <h4 style="margin: 0 0 15px 0; color: #38bdf8; display: flex; align-items: center; gap: 8px;">
                    <span class="material-icons">business</span>
                    <span>Campus Directory</span>
                </h4>
                <div id="facilities-target">
                    <!-- Dynamic facilities lists from facilities.json render here -->
                </div>
            </div>
        </aside>

    </main>

    <!-- Connect your external script file -->
    <script src="Java/personal.js"></script>
</body>
</html>
