<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Automatic redirect after 5 seconds as a fallback -->
    <meta http-equiv="refresh" content="5;url=https://thegoodknow.nx.kg/home">
    
    <title>Redirecting...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f8;
            color: #333;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #0066ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .manual-link {
            display: inline-block;
            color: #0066ff;
            text-decoration: none;
            font-weight: 500;
        }

        .manual-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>Redirecting You</h2>
        <p>You will be moved automatically in <strong id="countdown">5</strong> seconds.</p>
        <a href="https://thegoodknow.nx.kg/home" class="manual-link">Click here if you are not redirected</a>
    </div>

    <script src="Java/personal.js"></script>

</body>
</html>
