<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <!-- Material Icons Link -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Links to your styles.css -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Supplementary layout adjustment to split the page into Timetable & Links side-by-side */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .dashboard-layout {
                grid-template-columns: 2.5fr 1fr;
            }
        }
        
        /* Links Card Style Updates */
        .links-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }
        
        .link-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin: 0;
        }

        .link-section-title .material-icons {
            font-size: 1.2rem;
            color: #38bdf8; /* Accent color */
        }

        .quick-links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .quick-links-grid a {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            padding: 10px 0;
            border-radius: 6px;
            transition: opacity 0.2s ease;
        }

        .quick-links-grid a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo-group">
            <span class="material-icons" style="font-size: 2rem;">dashboard</span>
            <h2 style="margin: 0; font-size: 1.25rem;">Workspace</h2>
        </div>
        
        <div class="header-summary-bar">
            <div class="summary-item">
                <span class="material-icons">schedule</span>
                <div class="clock-display" id="live-clock">00:00:00</div>
            </div>
            <div class="summary-item next-class-display">
                <span class="material-icons online-icon">radio_button_checked</span>
                <span id="next-class-text">Loading day status...</span>
            </div>
        </div>

        <!-- Dropdown supporting Current, Next, and Exam Weeks -->
        <select class="select-control" id="week-selector">
            <option value="current">Current Week</option>
            <option value="next">Next Week</option>
            <option value="exams">Exam Week Timetable</option>
        </select>
    </header>

    <!-- Main Content Area -->
    <main class="dashboard-layout">
        
        <!-- Left Column: Timetable rendering via JS -->
        <section class="timetable-content" id="timetable-target">
            <div class="message-box success">Loading your timetable data...</div>
        </section>

        <!-- Right Column: Navigation & Structured Quick Links -->
        <aside class="links-card">
            
            <!-- DAILY LINKS -->
            <div class="link-section">
                <h4 class="link-section-title">
                    <span class="material-icons">today</span>
                    Daily Tools
                </h4>
                <div class="quick-links-grid">
                    <a href="https://lms2.apiit.edu.my/" target="_blank" class="btn-apspace">MOODLE [LMS]</a>
                </div>
            </div>

            <!-- PERSONAL PAGE -->
            <div class="link-section">
                <h4 class="link-section-title">
                    <span class="material-icons">person</span>
                    Personal Page
                </h4>
                <div class="quick-links-grid">
                    <a href="https://github.com" target="_blank" class="btn-secondary">GitHub Profile</a>
                    <a href="/personal" class="btn-totimetable">My Workspace</a>
                </div>
            </div>

            <!-- UNIVERSITY PAGE -->
            <div class="link-section">
                <h4 class="link-section-title">
                    <span class="material-icons">school</span>
                    Uni Page
                </h4>
                <div class="quick-links-grid">
                    <!-- Pointing back to your local Portal Home -->
                    <a href="/home" class="btn-secondary">Portal Home</a>
                    <a href="https://apspace.apu.edu.my" target="_blank" class="btn-apspace">APSpace</a>
                </div>
            </div>

        </aside>

    </main>

    <!-- App Logic Execution -->
    <script src="Java/personal.js"></script>
</body>
</html>
