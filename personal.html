<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal HomePage</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    
    <!-- Link to your original stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Material Icons Link -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Structural and Slidebar Layout Styles (Inherits design variables from style.css) -->
    <style>
        /* Main Workspace Two-Column Grid Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            padding: 24px;
            max-width: 1450px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        @media (max-width: 950px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar Container on the Left */
        #slidebar {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden offscreen by default */
            width: 280px;
            height: 100%;
            background-color: var(--bg-dark); 
            border-right: 1px solid var(--border-color);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            transition: left 0.3s ease; 
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        /* Slidebar Open State */
        #slidebar.open {
            left: 0; 
        }

        /* Sidebar Close Button Header */
        .sidebar-header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            outline: none;
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Sidebar Category Headers */
        .sidebar-section-title {
            color: var(--text-subtle);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-subtle);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 10px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-link:hover {
            background-color: var(--bg-card);
            color: var(--text-light);
        }

        /* Interactive Map Modal Overlay */
        #map-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #map-modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 6px;
            object-fit: contain;
            border: 2px solid var(--border-color);
        }

        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-subtle);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: var(--text-light);
        }

        /* Overriding sidebar-toggle layout slightly for clean alignment */
        #sidebar-toggle {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0;
            margin-right: -10px;
        }
    </style>
</head>
<body>

    <!-- Header containing logo, clock, and next class info -->
    <header class="header">
        <div class="logo-group">
            <!-- Left-hand sidebar toggle button integrated seamlessly -->
            <button id="sidebar-toggle">
                <span class="material-icons">menu</span>
            </button>
            <!-- Original APSpace logo -->
            <img id="logo-icon" src="img/apspace-logo.png" alt="APSpace Logo" onerror="this.style.display='none';">
        </div>

        <div class="header-summary-bar">
            <!-- Inline live clock -->
            <div class="summary-item">
                <span id="live-clock" class="clock-display">00:00:00 AM</span>
            </div>
            <!-- Dynamic schedule banner (Populated by personal.js) -->
            <div class="summary-item next-class-display">
                <span id="next-class-text" style="display: flex; align-items: center; gap: 5px;">
                    <span class="material-icons online-icon">play_arrow</span>
                    <span style="color: var(--color-current); font-weight: bold;">TIME UNTIL CLASS END: (0m 0s)</span>
                    <span style="color: var(--text-light);">| Loading today's schedule...</span>
                </span>
            </div>
        </div>

        <!-- Right Side View Dropdown Selector -->
        <div style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
            <span style="color: var(--text-subtle); font-size: 0.9rem;">Viewing:</span>
            <select id="week-selector" class="select-control">
                <option value="current">Today</option>
                <option value="next">Next Week Preview</option>
                <option value="exams">All Scheduled Exams</option>
            </select>
        </div>
    </header>

    <!-- Slide-out Sidebar Quick Links -->
    <div id="slidebar">
        <div class="sidebar-header">
            <button id="sidebar-close">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="sidebar-content">
            
            <!-- Daily Section -->
            <div class="sidebar-section-title">Daily Navigation</div>
            <a href="#" id="open-map-btn" class="sidebar-link">
                <span class="material-icons">map</span>
                <span>Campus Map</span>
            </a>

            <!-- Uni Section -->
            <div class="sidebar-section-title">University</div>
            <a href="https://apspace.apu.edu.my" target="_blank" class="sidebar-link">
                <span class="material-icons">school</span>
                <span>APSpace Portal</span>
            </a>

            <!-- Personal Section -->
            <div class="sidebar-section-title">Personal Web Utilities</div>
            <a href="https://thegoodknow.github.io/personal/pages/convert.html" target="_blank" class="sidebar-link">
                <span class="material-icons">transform</span>
                <span>Data Converter</span>
            </a>
            
        </div>
    </div>

    <!-- Campus Map Overlay Modal (Fixed Image Directory Path) -->
    <div id="map-modal">
        <div class="modal-content">
            <button id="close-map-btn" class="close-modal-btn">
                <span class="material-icons" style="font-size: 2.2rem;">cancel</span>
            </button>
            <h3 style="color: var(--text-light); margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;">APU Campus Map</h3>
            <!-- Pointing directly to img/ folder with URL spaces safely encoded as %20 -->
            <img src="img/APU%20MAP.jpeg" alt="APU Campus Map">
        </div>
    </div>

    <!-- Main Grid Dashboard Content -->
    <main class="main-container">
        
        <!-- Left Side: Timetable Display Section -->
        <section class="timetable-content" style="padding: 0; margin: 0;">
            <div id="timetable-target">
                <!-- Schedule card lists inject dynamically here from JS -->
            </div>
        </section>

        <!-- Right Side: Sidebar Widgets -->
        <aside style="display: flex; flex-direction: column; gap: 24px;">
            <!-- Urgent Deadline Panel -->
            <div class="class-card" style="padding: 16px;">
                <h4 style="margin: 0 0 12px 0; color: var(--text-subtle); display: flex; align-items: center; gap: 8px;">
                    <span class="material-icons" style="font-size: 1.2rem;">event</span>
                    <span>Urgent Deadline</span>
                </h4>
                <div id="assignment-target">
                    <!-- Target for deadline cards -->
                </div>
            </div>

            <!-- Campus Block & Room Finder Directory -->
            <div class="class-card" style="padding: 16px;">
                <h4 style="margin: 0 0 12px 0; color: var(--color-primary); display: flex; align-items: center; gap: 8px;">
                    <span class="material-icons">business</span>
                    <span>Campus Directory</span>
                </h4>
                <div id="facilities-target">
                    <!-- Target for room and floor facilities lists -->
                </div>
            </div>
        </aside>

    </main>

    <!-- Connect your external script file -->
    <script src="Java/personal.js"></script>
</body>
</html>
