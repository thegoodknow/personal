<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    
    <!-- Link to your original stylesheet (handles your themes, custom cards, colors) -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Material Icons Link -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- ONLY structural and layout styles (does not override your style.css designs) -->
<!-- Add this updated <style> block inside the <head> of your index.html -->
    <style>
        /* Sidebar Container on the Left */
        #slidebar {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden offscreen */
            width: 280px;
            height: 100%;
            background-color: #111827; 
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            transition: left 0.3s ease; 
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        /* Open State */
        #slidebar.open {
            left: 0; 
        }

        /* Close Button Header (Shows only the Close Icon) */
        .sidebar-header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Sidebar Section Headings */
        .sidebar-section-title {
            color: #4b5563;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 5px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 10px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-link:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Map Modal Styles */
        #map-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #map-modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 6px;
            object-fit: contain;
            border: 2px solid #334155;
        }

        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: #fff;
        }

        /* -------------------------------------------------- */
        /* RESTORING DOCKED LAYOUT FALLBACKS                  */
        /* (In case classes in style.css do not match HTML)   */
        /* -------------------------------------------------- */

        /* Main app side-by-side split layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Card background panel shapes */
        .content-section {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* Campus Directory Blocks */
        .directory-block {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .directory-block-title {
            font-size: 1rem;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        /* General layout structural alignments */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 24px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .clock-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
        <div class="header-title-group">
            <button id="sidebar-toggle" style="background:none; border:none; color:#fff; cursor:pointer;">
                <span class="material-icons" style="font-size: 1.8rem;">menu</span>
            </button>
            <span class="header-title">Workspace</span>
        </div>
        <div class="clock-container">
            <span class="material-icons">schedule</span>
            <span id="live-clock">00:00:00</span>
        </div>
    </header>

    <!-- Sidebar HTML Structure on Left with Section Categories -->
    <div id="slidebar">
        <div class="sidebar-header">
            <button id="sidebar-close">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="sidebar-content">
            
            <!-- Daily Section -->
            <div class="sidebar-section-title">Daily Navigation</div>
            <a href="#" id="open-map-btn" class="sidebar-link">
                <span class="material-icons">map</span>
                <span>Campus Map</span>
            </a>

            <!-- Uni Section -->
            <div class="sidebar-section-title">University</div>
            <a href="https://apspace.apu.edu.my" target="_blank" class="sidebar-link">
                <span class="material-icons">school</span>
                <span>APSpace Portal</span>
            </a>

            <!-- Personal Section -->
            <div class="sidebar-section-title">Personal Web Utilities</div>
            <a href="https://thegoodknow.github.io/personal/pages/convert.html" target="_blank" class="sidebar-link">
                <span class="material-icons">transform</span>
                <span>Data Converter</span>
            </a>
            
        </div>
    </div>

    <!-- Map Modal containing APU MAP.jpeg inside 'img/' directory -->
    <div id="map-modal">
        <div class="modal-content">
            <button id="close-map-btn" class="close-modal-btn">
                <span class="material-icons" style="font-size: 2.2rem;">cancel</span>
            </button>
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;">APU Campus Map</h3>
            <!-- Pointing correctly to img/ directory with encoded space -->
            <img src="img/APU%20MAP.jpeg" alt="APU Campus Map">
        </div>
    </div>

    <!-- Main Workspace Container -->
    <main class="main-container">
        
        <!-- Left Side: Dynamic Timetables -->
        <section class="content-section">
            <div class="selector-group">
                <span id="next-class-text" style="font-weight: bold; color: #38bdf8;">Loading Schedule...</span>
                <select id="week-selector">
                    <option value="current">Active Week</option>
                    <option value="next">Next Week Preview</option>
                    <option value="exams">All Scheduled Exams</option>
                </select>
            </div>
            
            <div id="timetable-target">
                <!-- Days and cards render here -->
            </div>
        </section>

        <!-- Right Side: Deadlines and Facilities Directories -->
        <aside style="display: flex; flex-direction: column; gap: 25px;">
            <!-- Urgency/Deadline Target -->
            <div class="content-section" style="padding: 15px;">
                <h4 style="margin: 0 0 10px 0; color: #94a3b8;">Urgent Deadline</h4>
                <div id="assignment-target">
                    <!-- Deadline card renders here -->
                </div>
            </div>

            <!-- Facilities/Block Directory Target -->
            <div class="content-section">
                <h4 style="margin: 0 0 15px 0; color: #38bdf8; display: flex; align-items: center; gap: 8px;">
                    <span class="material-icons">business</span>
                    <span>Campus Directory</span>
                </h4>
                <div id="facilities-target">
                    <!-- Dynamic facilities lists render here -->
                </div>
            </div>
        </aside>

    </main>

    <!-- Connect your external script file -->
    <script src="Java/personal.js"></script>
</body>
</html>
