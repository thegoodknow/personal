<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <!-- Material Icons Link required by your CSS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Links to your styles.css in the same directory -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Supplementary layout adjustment to split the page into Timetable & Links side-by-side */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .dashboard-layout {
                grid-template-columns: 2.5fr 1fr;
            }
        }
        .links-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }
        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .quick-links-grid a {
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section matching your CSS selectors -->
    <header class="header">
        <div class="logo-group">
            <span class="material-icons" style="font-size: 2rem;">dashboard</span>
            <h2 style="margin: 0; font-size: 1.25rem;">Workspace</h2>
        </div>
        
        <div class="header-summary-bar">
            <div class="summary-item">
                <span class="material-icons">schedule</span>
                <div class="clock-display" id="live-clock">00:00:00</div>
            </div>
            <div class="summary-item next-class-display">
                <span class="material-icons online-icon">radio_button_checked</span>
                <span id="next-class-text">Loading day status...</span>
            </div>
        </div>

        <select class="select-control" id="week-selector">
            <option value="current">Current Week</option>
            <option value="next">Next Week</option>
        </select>
    </header>

    <!-- Main Content Area -->
    <main class="dashboard-layout">
        
        <!-- Left Column: Timetable rendering via JS -->
        <section class="timetable-content" id="timetable-target">
            <!-- Dynamic day headers and class cards inject here -->
            <div class="message-box success">Loading your timetable data...</div>
        </section>

        <!-- Right Column: Navigation & Quick Links -->
        <aside class="links-card">
            <h3 style="margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                Quick Links
            </h3>
            <div class="quick-links-grid">
                <a href="https://lms2.apiit.edu.my/" target="_blank" class="btn-apspace" style="font-size: 0.85rem; padding: 10px 0;">MOODLE [LMS]</a>
                <a href="https://github.com" target="_blank" class="btn-secondary" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">GitHub</a>
                <a href="https:/home" class="btn-totimetable" style="text-decoration: none; text-align: center; font-size: 0.85rem;">Portal Home</a>
            </div>
        </aside>

    </main>

    <!-- App Logic Execution -->
    <script src='Java/personal.js'></script>
</body>
</html>
